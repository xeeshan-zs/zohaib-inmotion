openapi: 3.0.3
info:
  title: Zohaib InMotion API
  description: Public API for Zohaib's portfolio. Allows retrieving project data and contact information.
  version: 1.0.0
servers:
  - url: https://zohaib-inmotion.web.app
paths:
  /api/health.json:
    get:
      operationId: getHealthStatus
      summary: Health check endpoint
      description: Returns the health status of the API, used by agents to verify the API is reachable.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  version:
                    type: string
                    example: "1.0.0"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects.json:
    get:
      operationId: getProjects
      summary: Get all projects
      description: Retrieves a list of all featured concept studies and projects in the portfolio.
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              example: 404
            message:
              type: string
              example: "Resource not found"
            resolution:
              type: string
              example: "Check the API documentation for valid endpoints."
